[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismdoc"
version = "0.8.1"
description = "Cost-aware, schema-driven document extraction pipeline (deploy-as-microservice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prismdoc contributors" }]
keywords = ["document-extraction", "ocr", "llm", "pipeline", "invoice", "receipt", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]

# Permissive only — this is what makes `pip install prismdoc` MIT-compatible.
# PDF support is core rather than an extra because PDF is the format prismdoc
# exists for; pdfplumber (MIT) reads text and geometry, pypdfium2
# (Apache-2.0 / BSD-3, wrapping Google's PDFium) rasterises figures.
# PyMuPDF is deliberately NOT here — see the `pymupdf` extra.
dependencies = [
    "pydantic>=2.0,<3",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.0",
]

[project.urls]
Homepage = "https://github.com/gnutvz/prismdoc"
Repository = "https://github.com/gnutvz/prismdoc"
Changelog = "https://github.com/gnutvz/prismdoc/blob/main/CHANGELOG.md"
Issues = "https://github.com/gnutvz/prismdoc/issues"

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]", "python-multipart"]
dev = [
    "pytest",
    "ruff",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
]
docling = ["docling"]
# Kept for compatibility; pdfplumber is now a core dependency.
pdfplumber = ["pdfplumber>=0.11"]
# ⚠️ AGPL-3.0. PyMuPDF and pymupdf4llm are dual-licensed by Artifex: AGPL for
# open-source use, a paid commercial licence otherwise. Keeping them out of the
# core dependencies is what lets `pip install prismdoc` stay MIT-compatible —
# opting in is a licensing decision, so it has to be one the installer makes.
#
# This is not theoretical: a consumer with an automated licence gate (no GPL /
# AGPL / SSPL in the tree) cannot install prismdoc at all while PyMuPDF is a core
# dependency, however permissive prismdoc's own code is.
#
# Nothing requires this extra. It buys speed: `PyMuPDFEngine` is an alternative
# to the permissive default in `prismdoc.pdf`, not a missing piece.
pymupdf = ["pymupdf>=1.24"]
pymupdf4llm = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17"]
llm = ["litellm"]
viz = ["matplotlib"]

[project.scripts]
prismdoc = "prismdoc.cli:main"
prismdoc-eval = "prismdoc.eval.__main__:main"
prismdoc-sweep = "prismdoc.eval.sweep:main"
prismdoc-bench = "prismdoc.bench.sroie:main"
prismdoc-bench-hub = "prismdoc.bench.hub:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prismdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
